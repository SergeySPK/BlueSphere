name: blue_sphere
description: "Blue Sphere"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  vize: ^1.0.4
  flutter_max_miniapp:
    git:
      url: https://github.com/serezhia/flutter_max_miniapp.git
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter.ttf
          weight: 400
        - asset: fonts/Inter.ttf
          weight: 600
        - asset: fonts/Inter.ttf
          weight: 700

    - family: SF Pro
      fonts:
        - asset: fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: fonts/SF-Pro-Display-Medium.otf
          weight: 500
