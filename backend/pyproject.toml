[project]
name = "backend"
version = "0.1.0"
description = "Blue Sphere API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = "src"